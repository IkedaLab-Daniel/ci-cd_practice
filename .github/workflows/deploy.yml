name: Deploy Django Test App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/ci-cd_practice/backend
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt

            pm2 delete django-test || true

            pm2 start "python manage.py runserver 0.0.0.0:8000" --name django-test